<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      document.documentElement.classList.toggle(
        "dark",
        localStorage.getItem("shrt.theme") === "dark" ||
          (!localStorage.getItem("shrt.theme") &&
            matchMedia("(prefers-color-scheme: dark)").matches),
      );
    </script>

    <title>Knot — Short links that hold</title>
    <meta
      name="description"
      content="Knot is a fast, self-hosted URL shortener with custom aliases, auto-expiry, and a clean dashboard for your links. Short links that hold."
    />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Knot" />
    <meta property="og:title" content="Knot — Short links that hold" />
    <meta
      property="og:description"
      content="A fast, self-hosted URL shortener with custom aliases, auto-expiry, and a clean dashboard for your links."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Knot — Short links that hold" />
    <meta
      name="twitter:description"
      content="A fast, self-hosted URL shortener with custom aliases, auto-expiry, and a clean dashboard for your links."
    />
    <meta name="twitter:image" content="__OG_IMAGE__" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f7f8" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Knot",
        "alternateName": "knot.to",
        "url": "__SITE_URL__/",
        "description": "A fast, self-hosted URL shortener with custom aliases, auto-expiry, and a clean dashboard for your links.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "__SITE_URL__/app",
          "query-input": "required name=url"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
