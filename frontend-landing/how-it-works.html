<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      document.documentElement.classList.toggle(
        "dark",
        localStorage.getItem("shrt.theme") === "dark" ||
          (!localStorage.getItem("shrt.theme") &&
            matchMedia("(prefers-color-scheme: dark)").matches),
      );
    </script>

    <title>How it works — Knot</title>
    <meta
      name="description"
      content="How Knot shortens links: paste a long URL, get a short code, share it. Plain 302 redirects, 30-day auto-expiry, and a private dashboard keep your links tidy."
    />
    <link rel="canonical" href="__SITE_URL__/how-it-works" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Knot" />
    <meta property="og:title" content="How it works — Knot" />
    <meta
      property="og:description"
      content="Paste a long URL, get a short code, share it. Plain 302 redirects, auto-expiry, and a private dashboard."
    />
    <meta property="og:url" content="__SITE_URL__/how-it-works" />
    <meta property="og:image" content="__OG_IMAGE__" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="How it works — Knot" />
    <meta
      name="twitter:description"
      content="Paste a long URL, get a short code, share it. Plain 302 redirects, auto-expiry, and a private dashboard."
    />
    <meta name="twitter:image" content="__OG_IMAGE__" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f7f8" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
